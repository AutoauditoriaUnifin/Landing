<style>

body{

}

#reader{

/* TARJETA INFO */
.card{

/* BOTÓN */
.btn{

}

.btn:hover{
  background:#0D6E8C;
}

/* INPUT */
input{
  width:100%;
  padding:20px;
  box-sizing:border-box;
  margin-top:12px;
  border:2px solid #118AB2;
  border-radius:12px;

input::placeholder{

}

input:focus{
  outline:none;
  border-color:#1F3557;

}

/* BOTONES */
button{
  width:100%;
  padding:20px;
  background:#118AB2;
  color:white;
  border:none;
  border-radius:12px;
  margin-top:15px;
  cursor:pointer;
  font-size:24px;
  font-weight:700;
  transition:.3s;
}

button:hover{
  background:#0D6E8C;
}

/* RESULTADO */
#resultado{

}

/* =========================================
   TEXTOS DEL LECTOR QR
========================================= */

#reader{
  font-size:20px;
}

#reader button{
  font-size:21px !important;
  padding:16px !important;
}

#reader select{
  font-size:20px !important;
  padding:12px !important;
}

#reader span,
#reader div{

}

/* =========================================
   MENSAJES
========================================= */

#resultado{
  margin-top:25px;
  font-size:23px;
  line-height:1.5;
}

hr{
  margin:35px 0;
  border:none;
  border-top:2px solid #D9E3EA;
}

/* =========================================
   LANDING RESPONSIVA UNIFIN
========================================= */

:root {
  --unifin-charcoal: #374757;
  --unifin-dark-blue: #1F3557;
  --unifin-blue: #118AB2;
  --unifin-blue-hover: #0D6E8C;
  --unifin-light-blue: #EEF7FB;
  --unifin-gray: #EEF2F5;
  --unifin-green: #8EDD65;
  --unifin-light-green: #EFFBE9;
  --unifin-salmon: #FF8E72;
  --unifin-yellow: #FFD071;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  padding:
    max(14px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(25px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));

  background: #F4F6F8;
  color: var(--unifin-charcoal);
  font-family: Arial, sans-serif;
  font-size: 18px;
  line-height: 1.45;
}

/* Contenedor principal */
.container {
  width: 100%;
  max-width: 850px;
  margin: 0 auto;
  padding: clamp(16px, 4vw, 30px);
  background: #FFFFFF;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(55, 71, 87, 0.10);
  overflow: hidden;
}

/* Logo */
.logo {
  margin-bottom: 20px;
  text-align: center;
}

.logo img {
  display: block;
  width: min(260px, 75%);
  height: auto;
  margin: 0 auto;
}

/* Títulos */
h2 {
  margin: 0 0 22px;
  color: var(--unifin-dark-blue);
  text-align: center;
  font-size: clamp(30px, 8vw, 42px);
  line-height: 1.2;
  overflow-wrap: anywhere;
}

h3 {
  margin: 25px 0 14px;
  color: var(--unifin-blue);
  font-size: clamp(23px, 6vw, 28px);
  line-height: 1.3;
  overflow-wrap: anywhere;
}

/* Tarjeta del activo */
.card {
  width: 100%;
  min-width: 0;
  margin-top: 20px;
  padding: clamp(18px, 5vw, 28px);
  background: var(--unifin-gray);
  color: var(--unifin-charcoal);
  border-left: 7px solid var(--unifin-blue);
  border-radius: 14px;
  box-shadow: 0 5px 16px rgba(55, 71, 87, 0.08);
  font-size: clamp(18px, 4.8vw, 24px);
  line-height: 1.5;
  overflow: hidden;
}

.card h3 {
  margin-top: 0;
  color: var(--unifin-charcoal);
  text-align: center;
  font-size: clamp(26px, 7vw, 34px);
}

.card p {
  width: 100%;
  min-width: 0;
  margin: 16px 0;
  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: normal;
}

.card b {
  color: var(--unifin-dark-blue);
  font-size: inherit;
}

/* Evita que serie, QR y datos largos se salgan */
.dato-activo {
  display: inline;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}

/* Botones */
button,
.btn {
  display: flex;
  width: 100%;
  min-height: 58px;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  margin-top: 15px;
  background: var(--unifin-blue);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: clamp(19px, 5vw, 24px);
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  overflow-wrap: anywhere;
  box-shadow: 0 4px 10px rgba(17, 138, 178, 0.17);
  transition:
    background-color 0.2s ease,
    transform 0.15s ease;
  touch-action: manipulation;
}

button:active,
.btn:active {
  transform: scale(0.985);
}

/* Campo manual */
input {
  width: 100%;
  min-height: 58px;
  padding: 15px;
  margin-top: 12px;
  color: var(--unifin-charcoal);
  background: #FFFFFF;
  border: 2px solid var(--unifin-blue);
  border-radius: 12px;
  font-size: clamp(18px, 4.8vw, 23px);
}

input::placeholder {
  color: #7A8793;
  font-size: inherit;
  opacity: 1;
}

/* Lector */
#reader {
  width: 100%;
  min-width: 0;
  margin-top: 18px;
  border-radius: 12px;
  overflow: hidden;
}

#reader video,
#reader img,
#reader canvas {
  max-width: 100% !important;
}

/* =========================================
   ANIMACIÓN DE BÚSQUEDA
========================================= */

.estado-consulta {
  display: none;
  width: 100%;
  margin-top: 22px;
  padding: 25px 18px;
  background: var(--unifin-light-blue);
  color: var(--unifin-charcoal);
  border-left: 7px solid var(--unifin-blue);
  border-radius: 14px;
  text-align: center;
  font-size: clamp(20px, 5.5vw, 27px);
  font-weight: 700;
  line-height: 1.4;
}

.spinner-unifin {
  width: 54px;
  height: 54px;
  margin: 0 auto 16px;
  border: 6px solid #D6E8F0;
  border-top-color: var(--unifin-blue);
  border-right-color: var(--unifin-green);
  border-radius: 50%;
  animation: girarUnifin 0.85s linear infinite;
}

.puntos-carga::after {
  content: "";
  display: inline-block;
  width: 32px;
  text-align: left;
  animation: puntosUnifin 1.4s steps(4, end) infinite;
}

@keyframes girarUnifin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes puntosUnifin {
  0% {
    content: "";
  }

  25% {
    content: ".";
  }

  50% {
    content: "..";
  }

  75%,
  100% {
    content: "...";
  }
}

/* Teléfonos pequeños */
@media (max-width: 480px) {

  body {
    padding: 10px;
  }

  .container {
    padding: 16px;
    border-radius: 14px;
  }

  .card {
    padding: 18px 16px;
    border-left-width: 6px;
  }

  .card p {
    font-size: 19px;
    line-height: 1.5;
  }

  .card h3 {
    font-size: 27px;
  }

  button,
  .btn {
    font-size: 20px;
  }
}

/* Teléfonos muy angostos */
@media (max-width: 360px) {

  body {
    padding: 7px;
  }

  .container {
    padding: 13px;
  }

  .card {
    padding: 16px 13px;
  }

  .card p {
    font-size: 18px;
  }
}

@media (prefers-reduced-motion: reduce) {

  .spinner-unifin {
    animation-duration: 1.8s;
  }

  button,
  .btn {
    transition: none;
  }
}

/* Modal adaptable a teléfonos */
#modalCamara {
  overflow-y: auto;
}

#modalCamara > div {
  width: 100% !important;
  max-width: 650px !important;
  max-height: calc(100vh - 30px);
  padding: clamp(18px, 5vw, 30px) !important;
  overflow-y: auto;
}

#selectorCamara {
  width: 100%;
  min-height: 58px;
  font-size: clamp(18px, 4.8vw, 22px) !important;
}

@media (max-width: 480px) {

  #modalCamara {
    padding: 12px !important;
  }

  #modalCamara > div > div:first-child {
    font-size: 25px !important;
  }
}
 
</style>

<body>

<div class="container">

<div id="zonaBusqueda">

<div class="logo">

  <img
    src="https://autoauditoriaunifin.github.io/Landing/logoo.png"
    alt="UNIFIN">

</div>

<h2>Consulta de Activos UNIFIN</h2>

  <h3>Escanear QR</h3>

<button
  type="button"
  onclick="mostrarSelectorCamaras()">
  📷 Seleccionar cámara
</button>

<div id="reader"></div>

<button
  type="button"
  onclick="reiniciarScanner()">
  🔄 Volver a Escanear
</button>

<!-- =========================
     SELECCIONAR CÁMARA
========================= -->

<div
  id="modalCamara"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:25px;
    box-sizing:border-box;
  ">

  <div style="
    width:100%;
    max-width:650px;
    background:#FFFFFF;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    text-align:center;
  ">

    <div style="
      color:#1F3557;
      font-size:32px;
      font-weight:700;
      margin-bottom:20px;
    ">
      📷 Seleccione una cámara
    </div>

    <div style="
      color:#374757;
      font-size:23px;
      line-height:1.5;
      margin-bottom:20px;
    ">
      La cámara no se abrirá hasta que presione
      <b>Abrir cámara</b>.
    </div>

    <select
      id="selectorCamara"
      style="
        width:100%;
        padding:18px;
        border:2px solid #118AB2;
        border-radius:12px;
        background:#FFFFFF;
        color:#374757;
        font-size:22px;
        box-sizing:border-box;
      ">

      <option value="">
        Buscando cámaras...
      </option>

    </select>

    <div
      id="mensajeCamara"
      style="
        color:#C0392B;
        font-size:20px;
        margin-top:15px;
      ">
    </div>

    <button
      type="button"
      onclick="abrirCamaraSeleccionada()">
      Abrir cámara
    </button>

    <button
      type="button"
      onclick="cerrarSelectorCamaras()"
      style="
        background:#374757;
        margin-top:12px;
      ">
      Cancelar
    </button>

  </div>

</div>

  <hr>

  <h3>Buscar Manualmente (Ingrese el número del QR)</h3>

  <input
    type="text"
    id="txtID"
    placeholder="Ingrese el número del QR"
  >

  <button
  type="button"
  onclick="buscarManual()">
  🔍 Buscar Activo
</button>

</div>

<div
  id="estadoConsulta"
  class="estado-consulta"
  role="status"
  aria-live="polite">

  <div class="spinner-unifin"></div>

  <div id="textoEstadoConsulta">
    Buscando activo<span class="puntos-carga"></span>
  </div>

</div>

<div id="resultado"></div>

</div>

<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwSmRdlWIIimH44u9DA6q4nsUEIqphLRQMqS8TK5XBXcZpH-OsiDfEP3lBipYq6ScovVA/exec";

/* =========================================
   CONTROL DEL ESCÁNER QR
========================================= */

let lectorQR = null;
let camaraActiva = false;
let escaneoProcesado = false;


/* =========================================
   MOSTRAR SELECTOR DE CÁMARAS
========================================= */

async function mostrarSelectorCamaras() {

  const modal =
    document.getElementById("modalCamara");

  const selector =
    document.getElementById("selectorCamara");

  const mensaje =
    document.getElementById("mensajeCamara");

  modal.style.display = "flex";

  selector.innerHTML =
    '<option value="">Buscando cámaras...</option>';

  mensaje.textContent = "";

  try {

    /*
      El navegador puede solicitar permiso,
      pero todavía no iniciará la transmisión.
    */

    const camaras =
      await Html5Qrcode.getCameras();

    if (!camaras || camaras.length === 0) {

      selector.innerHTML =
        '<option value="">No se encontraron cámaras</option>';

      mensaje.textContent =
        "No se encontró ninguna cámara disponible.";

      return;
    }

    selector.innerHTML =
      '<option value="">Seleccione una cámara</option>';

    camaras.forEach(function(camara, indice) {

      const opcion =
        document.createElement("option");

      opcion.value =
        camara.id;

      opcion.textContent =
        camara.label ||
        "Cámara " + (indice + 1);

      selector.appendChild(opcion);

    });

    /*
      Intentar seleccionar automáticamente
      la cámara trasera en la lista, sin abrirla.
    */

    const opciones =
      Array.from(selector.options);

    const camaraTrasera =
      opciones.find(function(opcion) {

        const nombre =
          opcion.textContent.toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera") ||
          nombre.includes("environment")
        );

      });

    if (camaraTrasera) {
      selector.value = camaraTrasera.value;
    }

  } catch (error) {

    selector.innerHTML =
      '<option value="">No fue posible consultar las cámaras</option>';

    mensaje.textContent =
      "Debe permitir el acceso a la cámara para continuar.";

  }

}


/* =========================================
   CERRAR SELECTOR
========================================= */

function cerrarSelectorCamaras() {

  const modal =
    document.getElementById("modalCamara");

  modal.style.display = "none";

}


/* =========================================
   ABRIR LA CÁMARA SELECCIONADA
========================================= */

async function abrirCamaraSeleccionada() {

  const selector =
    document.getElementById("selectorCamara");

  const mensaje =
    document.getElementById("mensajeCamara");

  const cameraId =
    selector.value;

  if (!cameraId) {

    mensaje.textContent =
      "Seleccione una cámara antes de continuar.";

    return;
  }

  cerrarSelectorCamaras();

escaneoProcesado = false;

const reader =
  document.getElementById("reader");

reader.style.display = "block";

try {

    await detenerScanner();

    document.getElementById("reader").innerHTML = "";

    lectorQR =
      new Html5Qrcode("reader");

    await lectorQR.start(

      cameraId,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1
      },

      onScanSuccess,

      function() {
        /*
          Los intentos sin QR se ignoran.
        */
      }

    );

    camaraActiva = true;

  } catch (error) {

    camaraActiva = false;

    document.getElementById("resultado").innerHTML = `
      <div class="card">
        ❌ No fue posible abrir la cámara seleccionada.
        <br><br>
        Verifique los permisos de la cámara.
      </div>
    `;

  }

}

/* =========================================
   DETENER CÁMARA COMPLETAMENTE
========================================= */

async function detenerScanner() {

  if (!lectorQR) {

    camaraActiva = false;
    return;

  }

  try {

    /*
      Primero detener la transmisión.
      No cambiar camaraActiva antes de stop().
    */

    if (camaraActiva) {

      await lectorQR.stop();

    }

  } catch (error) {

    console.warn(
      "La cámara ya estaba detenida:",
      error
    );

  }

  try {

    lectorQR.clear();

  } catch (error) {

    console.warn(
      "No fue posible limpiar el lector:",
      error
    );

  }

  /*
    Liberación adicional de cualquier video
    que haya quedado dentro del lector.
  */

  const videos =
    document.querySelectorAll(
      "#reader video"
    );

  videos.forEach(function(video) {

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

      video.srcObject = null;

    }

  });

  lectorQR = null;
  camaraActiva = false;

  const reader =
    document.getElementById("reader");

  if (reader) {

    reader.innerHTML = "";
    reader.style.display = "none";

  }

}

/* =========================================
   VOLVER A ESCANEAR
========================================= */

async function reiniciarScanner() {

  escaneoProcesado = false;

  ocultarCargando();

  await detenerScanner();

  document.getElementById("resultado")
    .innerHTML = "";

  const zonaBusqueda =
    document.getElementById("zonaBusqueda");

  if (zonaBusqueda) {
    zonaBusqueda.style.display = "block";
  }

  const reader =
    document.getElementById("reader");

  if (reader) {
    reader.innerHTML = "";
    reader.style.display = "block";
  }

  const campoManual =
    document.getElementById("txtID");

  if (campoManual) {
    campoManual.value = "";
  }

  await mostrarSelectorCamaras();

}
/* =========================================
   QR DETECTADO
========================================= */

async function onScanSuccess(decodedText) {

  if (
    !camaraActiva ||
    escaneoProcesado
  ) {
    return;
  }

  /*
    Bloquea nuevas lecturas, pero no cambia
    camaraActiva antes de detener el lector.
  */

  escaneoProcesado = true;

  try {

    await detenerScanner();

  } catch (error) {

    console.warn(
      "No fue posible detener el lector:",
      error
    );

  }

  consultarActivo(decodedText);

}

async function buscarManual() {

  const campo =
    document.getElementById("txtID");

  const id =
    campo.value.trim();

  if (!id) {

    campo.focus();

    alert(
      "Ingrese el número del código QR."
    );

    return;
  }

  escaneoProcesado = true;

  await detenerScanner();

  consultarActivo(id);

}

function mostrarCargando(texto) {

  const estado =
    document.getElementById("estadoConsulta");

  const textoEstado =
    document.getElementById("textoEstadoConsulta");

  if (textoEstado) {

    textoEstado.innerHTML =
      texto +
      '<span class="puntos-carga"></span>';

  }

  if (estado) {
    estado.style.display = "block";
  }

}


function ocultarCargando() {

  const estado =
    document.getElementById("estadoConsulta");

  if (estado) {
    estado.style.display = "none";
  }

}

function abrirAutoauditoria(evento, url) {

  evento.preventDefault();

  /*
    Se abre inmediatamente para evitar
    que el navegador bloquee la pestaña.
  */

  const nuevaVentana =
    window.open("", "_blank");

  if (!nuevaVentana) {

    /*
      Si el navegador bloquea la pestaña,
      abre la auditoría en la ventana actual.
    */

    window.location.href = url;
    return false;

  }

  nuevaVentana.document.open();

  nuevaVentana.document.write(`
    <!DOCTYPE html>

    <html lang="es">

    <head>

      <meta charset="UTF-8">

      <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

      <title>Cargando Autoauditoría UNIFIN</title>

      <style>

        * {
          box-sizing: border-box;
        }

        html,
        body {
          width: 100%;
          min-height: 100%;
          margin: 0;
        }

        body {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 22px;
          background: #F4F6F8;
          color: #374757;
          font-family: Arial, sans-serif;
        }

        .pantalla-carga {
          width: 100%;
          max-width: 620px;
          padding: 38px 24px;
          background: #FFFFFF;
          border-left: 7px solid #118AB2;
          border-radius: 18px;
          box-shadow: 0 10px 30px rgba(55, 71, 87, 0.13);
          text-align: center;
        }

        .logo {
          display: block;
          width: min(260px, 80%);
          height: auto;
          margin: 0 auto 30px;
        }

        .spinner {
          width: 64px;
          height: 64px;
          margin: 0 auto 24px;
          border: 7px solid #D8EAF1;
          border-top-color: #118AB2;
          border-right-color: #8EDD65;
          border-radius: 50%;
          animation: girar 0.85s linear infinite;
        }

        h1 {
          margin: 0;
          color: #1F3557;
          font-size: clamp(27px, 7vw, 38px);
          line-height: 1.25;
        }

        p {
          margin: 18px 0 0;
          color: #374757;
          font-size: clamp(19px, 5vw, 25px);
          font-weight: 700;
          line-height: 1.4;
        }

        .puntos::after {
          content: "";
          display: inline-block;
          width: 32px;
          text-align: left;
          animation: puntos 1.4s steps(4, end) infinite;
        }

        .aviso {
          margin-top: 25px;
          padding: 15px;
          background: #EEF7FB;
          color: #374757;
          border-radius: 10px;
          font-size: clamp(16px, 4vw, 19px);
          font-weight: 400;
          line-height: 1.45;
        }

        @keyframes girar {

          to {
            transform: rotate(360deg);
          }

        }

        @keyframes puntos {

          0% {
            content: "";
          }

          25% {
            content: ".";
          }

          50% {
            content: "..";
          }

          75%,
          100% {
            content: "...";
          }

        }

        @media (prefers-reduced-motion: reduce) {

          .spinner {
            animation-duration: 1.8s;
          }

        }

      </style>

    </head>

    <body>

      <main
        class="pantalla-carga"
        role="status"
        aria-live="polite">

        <img
          class="logo"
          src="https://autoauditoriaunifin.github.io/Landing/logoo.png"
          alt="UNIFIN">

        <div class="spinner"></div>

        <h1>
          Autoauditoría UNIFIN
        </h1>

        <p>
          Cargando auditoría<span class="puntos"></span>
        </p>

        <div class="aviso">
          Espere un momento. Estamos preparando la información de su activo.
        </div>

      </main>

    </body>

    </html>
  `);

  nuevaVentana.document.close();

  /*
    Permite que la animación se muestre antes
    de comenzar la navegación.
  */

  setTimeout(function() {

    nuevaVentana.location.replace(url);

  }, 500);

  return false;

}

async function consultarActivo(id) {

  const resultado =
    document.getElementById("resultado");

  const zonaBusqueda =
    document.getElementById("zonaBusqueda");

  resultado.innerHTML = "";

  if (zonaBusqueda) {
    zonaBusqueda.style.display = "none";
  }

  mostrarCargando(
    "Buscando información del activo"
  );

  try {

    const respuesta =
      await fetch(
        API_URL +
        "?id=" +
        encodeURIComponent(id)
      );

    if (!respuesta.ok) {

      throw new Error(
        "El servidor no respondió correctamente."
      );

    }

    const data =
      await respuesta.json();

    ocultarCargando();

    if (!data.encontrado) {

      resultado.innerHTML = `
        <div class="card">

          <h3>
            ⚠️ Activo no encontrado
          </h3>

          <p style="text-align:center;">
            Verifique el número del código QR e intente nuevamente.
          </p>

          <button
            type="button"
            onclick="reiniciarScanner()"
            style="background:#374757;">

            🔄 Volver a escanear

          </button>

        </div>
      `;

      return;
    }

    resultado.innerHTML = `
      <div class="card">

        <h3>
          ✅ Activo encontrado
        </h3>

        <p>
          <b>Cliente:</b>
          <span class="dato-activo">
            ${data.cliente || "Sin información"}
          </span>
        </p>

        <p>
          <b>Anexo:</b>
          <span class="dato-activo">
            ${data.Annex || "Sin información"}
          </span>
        </p>

        <p>
          <b>Activo:</b>
          <span class="dato-activo">
            ${data.activo || "Sin información"}
          </span>
        </p>

        <p>
          <b>No. Serie:</b>
          <span class="dato-activo">
            ${data.NoSerie || "Sin información"}
          </span>
        </p>

        <p>
          <b>QR Number:</b>
          <span class="dato-activo">
            ${data.QrNumber || "Sin información"}
          </span>
        </p>

        <p>
          <b>Estatus:</b>
          <span class="dato-activo">
            ${data.estatus || "Sin información"}
          </span>
        </p>

        <a
  class="btn"
  href="${data.linkAuditoria}"
  onclick="return abrirAutoauditoria(event, this.href);">

  Abrir Autoauditoría

</a>

        <button
          type="button"
          onclick="reiniciarScanner()"
          style="background:#374757;">

          🔄 Volver a escanear

        </button>

      </div>
    `;

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    ocultarCargando();

    resultado.innerHTML = `
      <div class="card">

        <h3>
          ❌ No fue posible consultar el activo
        </h3>

        <p style="text-align:center;">
          Revise su conexión a Internet e intente nuevamente.
        </p>

        <button
          type="button"
          onclick="reiniciarScanner()"
          style="background:#374757;">

          🔄 Intentar nuevamente

        </button>

      </div>
    `;

  }

}

</script>
