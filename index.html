<!DOCTYPE html>
<html lang="es">
<head> 

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Consulta QR UNIFIN</title>
 
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial, sans-serif;
  font-size:22px;
  background:#F4F6F8;
  margin:0;
  padding:20px;
}

 /* LOGO */
.logo{

  text-align:center;
  margin-bottom:25px;

}

.logo img{

  width:260px;
  max-width:90%;
  height:auto;
  display:block;
  margin:auto;

}

/* CONTENEDOR PRINCIPAL */
.container{
  max-width:850px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* TITULO */
h2{
  text-align:center;
  color:#1F3557;
  font-size:42px;
  line-height:1.25;
  margin-bottom:18px;
}

/* SUBTITULOS */
h3{
  color:#118AB2;
  font-size:28px;
  line-height:1.35;
  margin-top:30px;
  margin-bottom:15px;
}

/* SCANNER */
#reader{
  width:100%;
  margin-top:20px;
  border-radius:12px;
  overflow:hidden;
}

/* TARJETA INFO */
.card{
  background:#EEF2F5;
  padding:28px;
  border-radius:14px;
  margin-top:25px;
  border-left:7px solid #118AB2;
  color:#374757;
  font-size:24px;
  line-height:1.55;
}

.card p{
  margin:16px 0;
}

.card b{
  font-size:25px;
}

/* BOTÓN */
.btn{
  display:block;
  width:100%;
  box-sizing:border-box;
  text-align:center;
  background:#118AB2;
  color:white;
  padding:20px 24px;
  border-radius:12px;
  text-decoration:none;
  margin-top:22px;
  font-size:25px;
  font-weight:700;
  transition:.3s;
}

.btn:hover{
  background:#0D6E8C;
}

/* INPUT */
input{
  width:100%;
  padding:20px;
  box-sizing:border-box;
  margin-top:12px;
  border:2px solid #118AB2;
  border-radius:12px;
  font-size:24px;
  color:#374757;
}

input::placeholder{
  font-size:21px;
  color:#7A8793;
}

input:focus{
  outline:none;
  border-color:#1F3557;
  box-shadow:0 0 0 4px rgba(17,138,178,.18);
}

/* BOTONES */
button{
  width:100%;
  padding:20px;
  background:#118AB2;
  color:white;
  border:none;
  border-radius:12px;
  margin-top:15px;
  cursor:pointer;
  font-size:24px;
  font-weight:700;
  transition:.3s;
}

button:hover{
  background:#0D6E8C;
}

/* RESULTADO */
#resultado{
  margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">

  <img
    src="https://autoauditoriaunifin.github.io/Landing/logoo.png"
    alt="UNIFIN">

</div>

<h2>Consulta de Activos UNIFIN</h2>

  <h3>Escanear QR</h3>

  <div id="reader"></div>

  <button onclick="reiniciarScanner()">
    🔄 Volver a Escanear
  </button>

  <hr>

  <h3>Buscar Manualmente (Ingrese el número del QR)</h3>

  <input
    type="text"
    id="txtID"
    placeholder="Ingrese el número del QR"
  >

  <button onclick="buscarManual()">
    🔍 Buscar Activo
  </button>

  <div id="resultado"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw7YnklUhfAKc_7juRMrC2lOjslv3EXDpb-kPRex6llHFrUyQSAu1cXDHj4kmtoHwjaXw/exec";

let html5QrcodeScanner;

iniciarScanner();

function iniciarScanner(){

  html5QrcodeScanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps:10,
        qrbox:250
      }
    );

  html5QrcodeScanner.render(onScanSuccess);
}

function reiniciarScanner(){

  document.getElementById("resultado").innerHTML = "";
  document.getElementById("reader").innerHTML = "";

  iniciarScanner();
}

function onScanSuccess(decodedText){

  html5QrcodeScanner.clear();

  consultarActivo(decodedText);
}

function buscarManual(){

  const id =
    document.getElementById("txtID").value.trim();

  if(!id){
    alert("Ingrese un ID.");
    return;
  }

  consultarActivo(id);
}

function consultarActivo(id){

  document.getElementById("resultado").innerHTML =
  "<p style='color:#118AB2;font-weight:bold;'>Consultando activo...</p>";

  fetch(API_URL + "?id=" + encodeURIComponent(id))

  .then(response => response.json())

  .then(data => {

    if(!data.encontrado){

      document.getElementById("resultado").innerHTML =
      `
      <div class="card">
        <h3>❌ Activo no encontrado</h3>
      </div>
      `;

      return;
    }

    document.getElementById("resultado").innerHTML =

`
<div class="card">

  <p><b>Cliente:</b> ${data.cliente}</p>

  <p><b>Anexo:</b> ${data.Annex}</p>

  <p><b>Activo:</b> ${data.activo}</p>

  <p><b>No. Serie:</b> ${data.NoSerie}</p>

  <p><b>QR Number:</b> ${data.QrNumber}</p>

  <p><b>Estatus:</b> ${data.estatus}</p>

  <a class="btn" href="${data.linkAuditoria}" target="_blank">
    Abrir Autoauditoría
  </a>

</div>
`;
  })

  .catch(error => {

    document.getElementById("resultado").innerHTML =
    `
    <div class="card">
      ❌ Error: ${error}
    </div>
    `;
  });
}

</script>

</body>
</html>
