<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Consulta QR UNIFIN</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial;
  background:#020724;
  margin:0;
  padding:20px;
}

.container{
  max-width:850px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:15px;
}

.logo{
  text-align:center;
}

.logo img{
  max-width:300px;
}

h2{
  text-align:center;
  color:#0033cc;
}

#reader{
  width:100%;
  margin-top:20px;
}

.card{
  background:#f5f5f5;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

.btn{
  display:inline-block;
  background:#0033cc;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  text-decoration:none;
  margin-top:15px;
}

.btn:hover{
  background:#001f8c;
}

input{
  width:100%;
  padding:12px;
  box-sizing:border-box;
  margin-top:10px;
}

button{
  width:100%;
  padding:14px;
  background:#0033cc;
  color:white;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}

button:hover{
  background:#001f8c;
}

#resultado{
  margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

  <div class="logo">
    <img src="https://i.ibb.co/W4Hm4LNy/unifin-logo-png-seeklogo.png">
  </div>

  <h2>Consulta de Activos UNIFIN</h2>

  <h3>Escanear QR</h3>

  <div id="reader"></div>

  <button onclick="reiniciarScanner()">
    Volver a Escanear
  </button>

  <hr>

  <h3>Buscar Manualmente(Ingrese el GpsId que tiene abajo del Qr)</h3>

  <input
    type="text"
    id="txtID"
    placeholder="Ingrese el ID del GPS"
  >

  <button onclick="buscarManual()">
    Buscar GPS
  </button>

  <div id="resultado"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzXiMSW4V_Ywe-JjcujqiRxcNk_-gf0mRln16ENQfbNTsBzDgDwkMliO197-EgCJ46z/exec";

let html5QrcodeScanner;

iniciarScanner();

function iniciarScanner(){

  html5QrcodeScanner =
    new Html5QrcodeScanner(
      "reader",
      {
        fps:10,
        qrbox:250
      }
    );

  html5QrcodeScanner.render(
    onScanSuccess
  );
}

function reiniciarScanner(){

  document.getElementById(
    "resultado"
  ).innerHTML = "";

  document.getElementById(
    "reader"
  ).innerHTML = "";

  iniciarScanner();
}

function onScanSuccess(decodedText){

  html5QrcodeScanner.clear();

  consultarActivo(
    decodedText
  );
}

function buscarManual(){

  const id =
    document.getElementById(
      "txtID"
    ).value.trim();

  if(!id){

    alert(
      "Ingrese un ID."
    );

    return;
  }

  consultarActivo(id);
}

function consultarActivo(id){

  document.getElementById(
    "resultado"
  ).innerHTML =
  "<p>Consultando activo...</p>";

  fetch(
    API_URL +
    "?id=" +
    encodeURIComponent(id)
  )

  .then(response =>
    response.json()
  )

  .then(data => {

    if(!data.encontrado){

      document.getElementById(
        "resultado"
      ).innerHTML =

      `
      <div class="card">
        <h3>Activo no encontrado</h3>
      </div>
      `;

      return;
    }

    document.getElementById(
      "resultado"
    ).innerHTML =

    `
    <div class="card">

      <p>
      <b>Cliente:</b>
      ${data.cliente}
      </p>

      <p>
      <b>Contrato:</b>
      ${data.contrato}
      </p>

      <p>
      <b>Activo:</b>
      ${data.activo}
      </p>

      <p>
      <b>GPSID:</b>
      ${data.id}
      </p>

      <p>
      <b>Estatus:</b>
      ${data.estatus}
      </p>

      <a
        class="btn"
        href="${data.linkAuditoria}"
        target="_blank"
      >
        Abrir Autoauditoría
      </a>

    </div>
    `;
  })

  .catch(error => {

    document.getElementById(
      "resultado"
    ).innerHTML =

    `
    <div class="card">
      Error:
      ${error}
    </div>
    `;
  });
}

</script>

</body>
</html>
