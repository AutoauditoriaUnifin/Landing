<!DOCTYPE html>
<html lang="es">
<head> 

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Consulta QR UNIFIN</title>
 
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial, sans-serif;
  font-size:22px;
  background:#F4F6F8;
  margin:0;
  padding:20px;
}

 /* LOGO */
.logo{

  text-align:center;
  margin-bottom:25px;

}

.logo img{

  width:260px;
  max-width:90%;
  height:auto;
  display:block;
  margin:auto;

}

/* CONTENEDOR PRINCIPAL */
.container{
  max-width:850px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* TITULO */
h2{
  text-align:center;
  color:#1F3557;
  font-size:42px;
  line-height:1.25;
  margin-bottom:18px;
}

/* SUBTITULOS */
h3{
  color:#118AB2;
  font-size:28px;
  line-height:1.35;
  margin-top:30px;
  margin-bottom:15px;
}

/* SCANNER */
#reader{
  width:100%;
  margin-top:20px;
  border-radius:12px;
  overflow:hidden;
}

/* TARJETA INFO */
.card{
  background:#EEF2F5;
  padding:28px;
  border-radius:14px;
  margin-top:25px;
  border-left:7px solid #118AB2;
  color:#374757;
  font-size:24px;
  line-height:1.55;
}

.card p{
  margin:16px 0;
}

.card b{
  font-size:25px;
}

/* BOTÓN */
.btn{
  display:block;
  width:100%;
  box-sizing:border-box;
  text-align:center;
  background:#118AB2;
  color:white;
  padding:20px 24px;
  border-radius:12px;
  text-decoration:none;
  margin-top:22px;
  font-size:25px;
  font-weight:700;
  transition:.3s;
}

.btn:hover{
  background:#0D6E8C;
}

/* INPUT */
input{
  width:100%;
  padding:20px;
  box-sizing:border-box;
  margin-top:12px;
  border:2px solid #118AB2;
  border-radius:12px;
  font-size:24px;
  color:#374757;
}

input::placeholder{
  font-size:16px;
  color:#7A8793;
}

input:focus{
  outline:none;
  border-color:#1F3557;
  box-shadow:0 0 0 4px rgba(17,138,178,.18);
}

/* BOTONES */
button{
  width:100%;
  padding:20px;
  background:#118AB2;
  color:white;
  border:none;
  border-radius:12px;
  margin-top:15px;
  cursor:pointer;
  font-size:24px;
  font-weight:700;
  transition:.3s;
}

button:hover{
  background:#0D6E8C;
}

/* RESULTADO */
#resultado{
  margin-top:20px;
}

/* =========================================
   TEXTOS DEL LECTOR QR
========================================= */

#reader{
  font-size:20px;
}

#reader button{
  font-size:21px !important;
  padding:16px !important;
}

#reader select{
  font-size:20px !important;
  padding:12px !important;
}

#reader span,
#reader div{
  line-height:1.4;
}

/* =========================================
   MENSAJES
========================================= */

#resultado{
  margin-top:25px;
  font-size:23px;
  line-height:1.5;
}

hr{
  margin:35px 0;
  border:none;
  border-top:2px solid #D9E3EA;
}
 
</style>

</head>

<body>

<div class="container">

<div class="logo">

  <img
    src="https://autoauditoriaunifin.github.io/Landing/logoo.png"
    alt="UNIFIN">

</div>

<h2>Consulta de Activos UNIFIN</h2>

  <h3>Escanear QR</h3>

<button
  type="button"
  onclick="mostrarSelectorCamaras()">
  📷 Seleccionar cámara
</button>

<div id="reader"></div>

<button
  type="button"
  onclick="reiniciarScanner()">
  🔄 Volver a Escanear
</button>

<!-- =========================
     SELECCIONAR CÁMARA
========================= -->

<div
  id="modalCamara"
  style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:25px;
    box-sizing:border-box;
  ">

  <div style="
    width:100%;
    max-width:650px;
    background:#FFFFFF;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    text-align:center;
  ">

    <div style="
      color:#1F3557;
      font-size:32px;
      font-weight:700;
      margin-bottom:20px;
    ">
      📷 Seleccione una cámara
    </div>

    <div style="
      color:#374757;
      font-size:23px;
      line-height:1.5;
      margin-bottom:20px;
    ">
      La cámara no se abrirá hasta que presione
      <b>Abrir cámara</b>.
    </div>

    <select
      id="selectorCamara"
      style="
        width:100%;
        padding:18px;
        border:2px solid #118AB2;
        border-radius:12px;
        background:#FFFFFF;
        color:#374757;
        font-size:22px;
        box-sizing:border-box;
      ">

      <option value="">
        Buscando cámaras...
      </option>

    </select>

    <div
      id="mensajeCamara"
      style="
        color:#C0392B;
        font-size:20px;
        margin-top:15px;
      ">
    </div>

    <button
      type="button"
      onclick="abrirCamaraSeleccionada()">
      Abrir cámara
    </button>

    <button
      type="button"
      onclick="cerrarSelectorCamaras()"
      style="
        background:#374757;
        margin-top:12px;
      ">
      Cancelar
    </button>

  </div>

</div>

  <hr>

  <h3>Buscar Manualmente (Ingrese el número del QR)</h3>

  <input
    type="text"
    id="txtID"
    placeholder="Ingrese el número del QR"
  >

  <button onclick="buscarManual()">
    🔍 Buscar Activo
  </button>

  <div id="resultado"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbw7YnklUhfAKc_7juRMrC2lOjslv3EXDpb-kPRex6llHFrUyQSAu1cXDHj4kmtoHwjaXw/exec";

/* =========================================
   CONTROL DEL ESCÁNER QR
========================================= */

let lectorQR = null;
let camaraActiva = false;


/* =========================================
   MOSTRAR SELECTOR DE CÁMARAS
========================================= */

async function mostrarSelectorCamaras() {

  const modal =
    document.getElementById("modalCamara");

  const selector =
    document.getElementById("selectorCamara");

  const mensaje =
    document.getElementById("mensajeCamara");

  modal.style.display = "flex";

  selector.innerHTML =
    '<option value="">Buscando cámaras...</option>';

  mensaje.textContent = "";

  try {

    /*
      El navegador puede solicitar permiso,
      pero todavía no iniciará la transmisión.
    */

    const camaras =
      await Html5Qrcode.getCameras();

    if (!camaras || camaras.length === 0) {

      selector.innerHTML =
        '<option value="">No se encontraron cámaras</option>';

      mensaje.textContent =
        "No se encontró ninguna cámara disponible.";

      return;
    }

    selector.innerHTML =
      '<option value="">Seleccione una cámara</option>';

    camaras.forEach(function(camara, indice) {

      const opcion =
        document.createElement("option");

      opcion.value =
        camara.id;

      opcion.textContent =
        camara.label ||
        "Cámara " + (indice + 1);

      selector.appendChild(opcion);

    });

    /*
      Intentar seleccionar automáticamente
      la cámara trasera en la lista, sin abrirla.
    */

    const opciones =
      Array.from(selector.options);

    const camaraTrasera =
      opciones.find(function(opcion) {

        const nombre =
          opcion.textContent.toLowerCase();

        return (
          nombre.includes("back") ||
          nombre.includes("rear") ||
          nombre.includes("trasera") ||
          nombre.includes("environment")
        );

      });

    if (camaraTrasera) {
      selector.value = camaraTrasera.value;
    }

  } catch (error) {

    selector.innerHTML =
      '<option value="">No fue posible consultar las cámaras</option>';

    mensaje.textContent =
      "Debe permitir el acceso a la cámara para continuar.";

  }

}


/* =========================================
   CERRAR SELECTOR
========================================= */

function cerrarSelectorCamaras() {

  const modal =
    document.getElementById("modalCamara");

  modal.style.display = "none";

}


/* =========================================
   ABRIR LA CÁMARA SELECCIONADA
========================================= */

async function abrirCamaraSeleccionada() {

  const selector =
    document.getElementById("selectorCamara");

  const mensaje =
    document.getElementById("mensajeCamara");

  const cameraId =
    selector.value;

  if (!cameraId) {

    mensaje.textContent =
      "Seleccione una cámara antes de continuar.";

    return;
  }

  cerrarSelectorCamaras();

  try {

    await detenerScanner();

    document.getElementById("reader").innerHTML = "";

    lectorQR =
      new Html5Qrcode("reader");

    await lectorQR.start(

      cameraId,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1
      },

      onScanSuccess,

      function() {
        /*
          Los intentos sin QR se ignoran.
        */
      }

    );

    camaraActiva = true;

  } catch (error) {

    camaraActiva = false;

    document.getElementById("resultado").innerHTML = `
      <div class="card">
        ❌ No fue posible abrir la cámara seleccionada.
        <br><br>
        Verifique los permisos de la cámara.
      </div>
    `;

  }

}


/* =========================================
   DETENER CÁMARA
========================================= */

async function detenerScanner() {

  if (!lectorQR) {
    return;
  }

  try {

    if (camaraActiva) {
      await lectorQR.stop();
    }

    lectorQR.clear();

  } catch (error) {

    console.log(
      "El lector ya estaba detenido."
    );

  }

  lectorQR = null;
  camaraActiva = false;

}


/* =========================================
   VOLVER A ESCANEAR
========================================= */

async function reiniciarScanner() {

  document.getElementById("resultado").innerHTML = "";

  await detenerScanner();

  document.getElementById("reader").innerHTML = "";

  /*
    Volver a mostrar la lista.
    No abre automáticamente ninguna cámara.
  */

  mostrarSelectorCamaras();

}


/* =========================================
   QR DETECTADO
========================================= */

async function onScanSuccess(decodedText) {

  if (!camaraActiva) {
    return;
  }

  camaraActiva = false;

  await detenerScanner();

  consultarActivo(decodedText);

}

function buscarManual(){

  const id =
    document.getElementById("txtID").value.trim();

  if(!id){
    alert("Ingrese un ID.");
    return;
  }

  consultarActivo(id);
}

function consultarActivo(id){

  document.getElementById("resultado").innerHTML =
  "<p style='color:#118AB2;font-weight:bold;'>Consultando activo...</p>";

  fetch(API_URL + "?id=" + encodeURIComponent(id))

  .then(response => response.json())

  .then(data => {

    if(!data.encontrado){

      document.getElementById("resultado").innerHTML =
      `
      <div class="card">
        <h3>❌ Activo no encontrado</h3>
      </div>
      `;

      return;
    }

    document.getElementById("resultado").innerHTML =

`
<div class="card">

  <p><b>Cliente:</b> ${data.cliente}</p>

  <p><b>Anexo:</b> ${data.Annex}</p>

  <p><b>Activo:</b> ${data.activo}</p>

  <p><b>No. Serie:</b> ${data.NoSerie}</p>

  <p><b>QR Number:</b> ${data.QrNumber}</p>

  <p><b>Estatus:</b> ${data.estatus}</p>

  <a class="btn" href="${data.linkAuditoria}" target="_blank">
    Abrir Autoauditoría
  </a>

</div>
`;
  })

  .catch(error => {

    document.getElementById("resultado").innerHTML =
    `
    <div class="card">
      ❌ Error: ${error}
    </div>
    `;
  });
}

</script>

</body>
</html>
